# Include inside the app's <Directory> block (requires mod_mime + mod_headers).
# No rewrite/SPA fallback: missing JSON, decoders and models must remain 404.
Options -Indexes -MultiViews
DirectoryIndex index.html
AddType text/javascript .js .mjs
AddType text/css .css
AddType application/json .json
AddType application/wasm .wasm
AddType model/gltf-binary .glb
AddType image/vnd.radiance .hdr
AddType font/woff2 .woff2
AddType font/woff .woff
AddType font/ttf .ttf
AddType audio/mpeg .mp3
AddType video/mp4 .mp4
Header always set X-Content-Type-Options "nosniff"
Header always set Cache-Control "public, max-age=3600, must-revalidate"
<FilesMatch "\.(html|json)$">
    Header always set Cache-Control "no-store"
</FilesMatch>
<FilesMatch "-[A-Za-z0-9_-]{8,}\.(js|css|woff2|wasm)$">
    Header always set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

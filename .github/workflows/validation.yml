name: Validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Tests, integrity and static Apache hosting
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BROWSER: none
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m pip install -r requirements-validation.txt
      - run: python -m playwright install --with-deps chromium
      - name: Select pinned Playwright Chromium
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_EXECUTABLE=' + p.chromium.executable_path)
          PY
      - run: python -m unittest tests.test_assignment_contract -v
      - run: python scripts/check-dist.py --dist dist --base /
      - run: python -m unittest tests.test_release_artifacts -v
      - name: Windows checkout and CP950 compatibility regressions
        run: python -m unittest tests.test_windows_compatibility -v
      - name: Accepted controls, contracts, Matrix geometry and Unicode regressions
        run: python scripts/run-browser-regressions.py
      - name: Phase 3 headed Pointer Lock parity (Xvfb)
        run: xvfb-run -a python scripts/run-browser-regressions.py --suite phase-3 --phase-3-headed
      - name: Local Apache test dependency (no deployment)
        run: sudo apt-get update && sudo apt-get install -y apache2-bin media-types
      - name: Built root, nested and UserDir smoke (network/DOM; no hardware parity claim)
        run: python scripts/production-smoke.py --allow-software-device-loss
      # No deployment, secrets, distribution archive or artifact upload steps.
  windows-compatibility:
    name: Windows LF hashes and Python 3.14 UTF-8 I/O
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: '0'
    steps:
      - name: Exercise Windows-style checkout
        run: git config --global core.autocrlf true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m pip install jsonschema==4.26.0
      - run: python -m unittest tests.test_assignment_contract tests.test_release_artifacts tests.test_windows_compatibility -v
      - run: python scripts/check-dist.py --dist dist --base /
